name: Deploy (production)
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # Workload Identity Federation: despliegue SIN llaves

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Autenticación federada con GCP (sin llaves)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Build
        run: pnpm build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_APPCHECK_SITE_KEY: ${{ vars.VITE_APPCHECK_SITE_KEY }}
          VITE_USE_EMULATORS: ${{ vars.VITE_USE_EMULATORS }}

      # Orden garantizado: reglas e índices ANTES que el código que depende de ellos
      - name: Deploy rules + indexes
        run: pnpm exec firebase deploy --only firestore:rules,firestore:indexes,storage --project ${{ vars.GCP_PROJECT_ID }} --non-interactive

      - name: Deploy functions
        run: pnpm exec firebase deploy --only functions --project ${{ vars.GCP_PROJECT_ID }} --non-interactive --force

      - name: Deploy hosting
        run: pnpm exec firebase deploy --only hosting --project ${{ vars.GCP_PROJECT_ID }} --non-interactive

      - name: Smoke test post-deploy
        run: |
          sleep 10
          curl -fsS "https://${{ vars.GCP_PROJECT_ID }}.web.app/v1/health" | grep '"ok":true'
