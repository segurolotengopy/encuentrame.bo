name: Preview channel
on:
  pull_request:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Build web
        run: pnpm --filter @encuentrame/web build

      - name: Deploy preview channel (expira en 7 días)
        run: |
          pnpm exec firebase hosting:channel:deploy pr-${{ github.event.number }} \
            --project ${{ vars.GCP_PROJECT_ID }} --expires 7d --non-interactive
